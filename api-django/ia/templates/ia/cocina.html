<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cocina - Heladería</title>
<style>
  body { font-family: Arial, sans-serif; background: #fff5f8; margin: 0; }
  header { background: #e84a8a; color: white; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; font-size: 22px; }
  header a { color: white; margin-left: 16px; }
  main { max-width: 900px; margin: 24px auto; padding: 0 16px; }
  #lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .tarjeta { background: white; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .tarjeta h3 { margin: 0 0 8px 0; }
  .estado { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 13px; background: #ffe0ec; color: #e84a8a; margin-bottom: 8px; }
  .estado.prep { background: #fff3cd; color: #8a6d00; }
  ul { padding-left: 18px; margin: 8px 0 12px 0; }
  button { background: #e84a8a; color: white; border: none; border-radius: 6px; padding: 8px 14px; cursor: pointer; width: 100%; }
  button.verde { background: #0a7a2f; }
  #vacio { color: #666; }
  #aviso { margin-bottom: 12px; font-weight: bold; color: #c00; }
</style>
</head>
<body>
<header>
  <h1>👩‍🍳 Cocina</h1>
  <div><a href="/mesero/">Mesero</a><a href="/chat/">Asistente</a></div>
</header>
<main>
  <div id="aviso"></div>
  <div id="lista"></div>
  <p id="vacio" style="display:none">No hay pedidos pendientes.</p>
</main>
<script>
  const token = localStorage.getItem("token");
  if (!token) { location.href = "/chat/"; }
  const H = { "Authorization": "Bearer " + token, "Content-Type": "application/json" };

  async function api(url, opciones) {
    const r = await fetch(url, Object.assign({ headers: H }, opciones || {}));
    if (r.status === 401) { localStorage.clear(); location.href = "/chat/"; throw new Error("401"); }
    return r;
  }

  function nombreMesa(p) {
    if (p.mesa_numero !== undefined) return p.mesa_numero;
    if (p.mesa && typeof p.mesa === "object") return p.mesa.numero !== undefined ? p.mesa.numero : p.mesa.id_mesa;
    return p.mesa;
  }

  function textoDetalle(d) {
    let nombre = d.nombre_producto;
    if (nombre === undefined && d.producto && typeof d.producto === "object") nombre = d.producto.nombre;
    if (nombre === undefined) nombre = "Producto " + d.producto;
    return d.cantidad + " x " + nombre;
  }

  async function cambiarEstado(id, estado) {
    const aviso = document.getElementById("aviso");
    aviso.textContent = "";
    const r = await api("/api/pedidos/" + id + "/", {
      method: "PATCH",
      body: JSON.stringify({ estado: estado }),
    });
    if (!r.ok) { aviso.textContent = JSON.stringify(await r.json()); }
    cargar();
  }

  async function cargar() {
    const lista = document.getElementById("lista");
    const datos = await (await api("/api/pedidos/")).json();
    const pedidos = (Array.isArray(datos) ? datos : datos.results || []).filter(function (p) {
      return p.estado === "pendiente" || p.estado === "en preparacion";
    });
    lista.innerHTML = "";
    document.getElementById("vacio").style.display = pedidos.length ? "none" : "block";
    pedidos.forEach(function (p) {
      const t = document.createElement("div");
      t.className = "tarjeta";
      const h = document.createElement("h3");
      h.textContent = "Pedido #" + p.id_pedido + " - Mesa " + nombreMesa(p);
      const e = document.createElement("span");
      e.className = "estado" + (p.estado === "en preparacion" ? " prep" : "");
      e.textContent = p.estado;
      const ul = document.createElement("ul");
      (p.detalles || []).forEach(function (d) {
        const li = document.createElement("li");
        li.textContent = textoDetalle(d);
        ul.appendChild(li);
      });
      const b = document.createElement("button");
      if (p.estado === "pendiente") {
        b.textContent = "En preparación";
        b.onclick = function () { cambiarEstado(p.id_pedido, "en preparacion"); };
      } else {
        b.textContent = "Despachar";
        b.className = "verde";
        b.onclick = function () { cambiarEstado(p.id_pedido, "listo"); };
      }
      t.appendChild(h);
      t.appendChild(e);
      t.appendChild(ul);
      t.appendChild(b);
      lista.appendChild(t);
    });
  }

  if (token) {
    cargar();
    setInterval(cargar, 5000);
  }
</script>
</body>
</html>
